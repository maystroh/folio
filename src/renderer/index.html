<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' http://localhost:5173 ws://localhost:5173; object-src 'none'; frame-src 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Folio</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f2eee6;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #101110;
      }
      #root {
        height: 100vh;
      }
    </style>
    <script>
      try {
        var storedTheme = localStorage.getItem('folio-theme');
        if (storedTheme === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
